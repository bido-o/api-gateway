spring:
  data:
    redis:
      # Redis este mock-uit în teste cu @MockitoBean — acestea sunt valori placeholder
      # Nu se face conexiune reală.
      host: localhost
      port: 6379
      password: ""

  main:
    # Permite override-ul bean-urilor de Redis cu mock-uri
    allow-bean-definition-overriding: true

gateway:
  downstream:
    # Port izolat pentru teste — niciun serviciu real nu rulează aici
    auth-url: http://localhost:18081
  rate-limit:
    replenish-rate: 1000
    burst-capacity: 2000

management:
  tracing:
    sampling:
      probability: 0.0   # Fără overhead de tracing în teste

logging:
  level:
    com.bido.api_gateway: WARN
    org.springframework.cloud.gateway: WARN

jwt:
  # Cheie folosită DOAR în teste
  secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMzItY2hhcnM=