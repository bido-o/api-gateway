server:
  port: 8080

spring:
  application:
    name: api-gateway

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${gateway.cors.allowed-origins}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                allowCredentials: true
                maxAge: 3600
          routes:
            # Rute de admin — PROTEJATE. Trebuie definite ÎNAINTEA lui auth-route,
            # altfel /api/auth/admin/** s-ar potrivi pe ruta publică și X-User-Role
            # ar putea fi spoof-uit. JwtValidationFilter + ContextPropagationFilter
            # șterg header-ele spoof-uite și le setează din claims-urile JWT.
            - id: auth-admin-route
              uri: ${gateway.downstream.auth-url}
              predicates:
                - Path=/api/auth/admin/**
              filters:
                - JwtValidationFilter
                - ContextPropagationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.auth.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.auth.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userIdKeyResolver}"

            - id: auth-route
              uri: ${gateway.downstream.auth-url}
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.auth.replenish-rate} # tokeni/secundă regenerați
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.auth.burst-capacity} # maximul de tokeni
                    redis-rate-limiter.requestedTokens: 1 # fiecare request consumă 1 token
                    key-resolver: "#{@ipKeyResolver}"

            - id: profile-route
              uri: ${gateway.downstream.profile-url}
              predicates:
                - Path=/api/client-profiles/**,/api/supplier-profiles/**
              filters:
                - JwtValidationFilter
                - ContextPropagationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.profile.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.profile.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userIdKeyResolver}"

            - id: bidding-service-route
              uri: ${gateway.downstream.bidding-service-url}
              predicates:
                - Path=/api/requests/**,/api/offers/**,/api/event-types/**
              filters:
                - JwtValidationFilter
                - ContextPropagationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.bidding-service.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.bidding-service.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userIdKeyResolver}"

            - id: menu-my-route
              uri: ${gateway.downstream.menu-url}
              predicates:
                - Path=/api/menu/items/my
              filters:
                - JwtValidationFilter
                - ContextPropagationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.menu.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.menu.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userIdKeyResolver}"

            - id: menu-write-route
              uri: ${gateway.downstream.menu-url}
              predicates:
                - Path=/api/menu/**
                - Method=POST,PUT,PATCH,DELETE
              filters:
                - JwtValidationFilter
                - ContextPropagationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.menu.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.menu.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userIdKeyResolver}"

            - id: menu-read-route
              uri: ${gateway.downstream.menu-url}
              predicates:
                - Path=/api/menu/**
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${gateway.rate-limit.menu.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.rate-limit.menu.burst-capacity}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"


management:
  tracing:
    sampling:
      probability: ${tracing.sampling-probability:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"