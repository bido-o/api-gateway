server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 3    # 3 tokeni/secundă regenerați
                    redis-rate-limiter.burstCapacity: 8   # max 8 tokeni
                    redis-rate-limiter.requestedTokens: 1  # fiecare request consumă 1 token
                    key-resolver: "#{@ipKeyResolver}"

management:
  tracing:
    sampling:
      probability: 1.0 #in dev, in prod 0.1
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.cloud.gateway: INFO

jwt:
  secret: ${JWT_SECRET_KEY}